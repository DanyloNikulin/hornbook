name: Process lesson

on:
  workflow_dispatch:
    inputs:
      r2_key:
        description: 'R2 object key (e.g. 2026-05-25-imperfetto.m4a)'
        required: true
        type: string
      date:
        description: 'Lesson date YYYY-MM-DD (defaults to date prefix in r2_key)'
        required: false
        type: string
  repository_dispatch:
    types: [process-lesson]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Two uploads minutes apart used to run in parallel, both spend OpenAI +
# Claude, and the second one failed its rebase on cheatsheet.json. Queue them
# instead — never cancel, a cancelled run is paid work thrown away.
concurrency:
  group: lesson-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci --no-audit --no-fund

      - name: Resolve trigger inputs
        id: input
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_R2_KEY: ${{ github.event.client_payload.r2_key }}
          CLIENT_DATE: ${{ github.event.client_payload.date }}
          INPUT_R2_KEY: ${{ inputs.r2_key }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            r2_key="$CLIENT_R2_KEY"
            date_input="$CLIENT_DATE"
          else
            r2_key="$INPUT_R2_KEY"
            date_input="$INPUT_DATE"
          fi
          if [ -z "$r2_key" ]; then
            echo "::error::r2_key is required"; exit 1
          fi
          # Allowlist: extension must be a known audio/video format, and the
          # value must not contain bytes that break shell quoting/command
          # substitution even inside double quotes (" $ ` \\ CR LF NUL).
          # Unicode letters, spaces, commas etc. are fine — the workflow
          # quotes "$R2_KEY" everywhere it's used.
          # -i: the worker's allowlist is case-insensitive (`Lezione.MP4` from
          # an iPhone export dispatches), so accept the same here (issue #71).
          if ! printf '%s' "$r2_key" | grep -Piq '^[^"$`\\\r\n\x00]+\.(mp4|m4a|mp3|wav|opus|ogg|webm|mov)$'; then
            echo "::error::r2_key failed allowlist: $r2_key"; exit 1
          fi
          if [ -n "$date_input" ] && ! printf '%s' "$date_input" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::date input must be YYYY-MM-DD: $date_input"; exit 1
          fi
          echo "r2_key=$r2_key" >> "$GITHUB_OUTPUT"
          echo "date_input=$date_input" >> "$GITHUB_OUTPUT"
          echo "Trigger: $EVENT_NAME"
          echo "r2_key: $r2_key"

      - name: Derive branch name + date
        id: meta
        env:
          KEY: ${{ steps.input.outputs.r2_key }}
          DATE_INPUT: ${{ steps.input.outputs.date_input }}
        run: |
          stem="${KEY%.*}"
          stem="${stem##*/}"
          branch="lesson/${stem}"

          date_val="$DATE_INPUT"
          if [ -z "$date_val" ]; then
            # Strict: a YYYY-MM-DD prefix that is the clean start of the stem
            # (followed by a separator or end). "2026-05 -12" (stray space) and
            # "2026-05-123" (3-digit day) do NOT match.
            date_val=$(printf '%s' "$stem" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ -n "$date_val" ] && ! printf '%s' "$stem" | grep -qE "^${date_val}([-_. ]|$)"; then
              date_val=""
            fi
          fi

          # No silent fallback to "today". A missing/garbled date prefix is
          # almost always a typo in the upload name; processing it would
          # mis-date the lesson AND burn transcription + Claude tokens. Fail
          # loudly here — this step runs BEFORE the download/pipeline steps, so
          # nothing is transcribed and no API tokens are spent.
          if [ -z "$date_val" ]; then
            echo "::error title=Bad lesson filename::R2 key '${KEY}' has no valid YYYY-MM-DD date prefix. Rename the upload to start with the lesson date (e.g. 2026-05-12-topic.mp4) and re-upload. Nothing transcribed — no tokens spent."
            exit 1
          fi
          if ! date -u -d "$date_val" +%F >/dev/null 2>&1; then
            echo "::error title=Bad lesson date::'${date_val}' (from R2 key '${KEY}') is not a real calendar date. Refusing to process — no tokens spent."
            exit 1
          fi

          {
            echo "branch=$branch"
            echo "date=$date_val"
            echo "stem=$stem"
          } >> "$GITHUB_OUTPUT"
          echo "Branch: $branch"
          echo "Date: $date_val"

      - name: Download from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_KEY: ${{ steps.input.outputs.r2_key }}
          STEM: ${{ steps.meta.outputs.stem }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p input
          # Detect extension from r2_key to preserve container
          ext="${R2_KEY##*.}"
          [ "$ext" = "$R2_KEY" ] && ext="m4a"
          aws s3 cp \
            "s3://${R2_BUCKET}/${R2_KEY}" \
            "input/${STEM}.${ext}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress
          ls -lh input/

      - name: Run lesson pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STEM: ${{ steps.meta.outputs.stem }}
          DATE: ${{ steps.meta.outputs.date }}
          R2_KEY: ${{ steps.input.outputs.r2_key }}
        run: |
          ext="${R2_KEY##*.}"
          [ "$ext" = "$R2_KEY" ] && ext="m4a"
          npx tsx scripts/process.ts \
            "input/${STEM}.${ext}" \
            --date "$DATE" \
            --workdir "work/run"

      # The lesson is the expensive artefact (transcription + extraction). It
      # is committed and pushed BEFORE the cheatsheet step so a cheatsheet
      # failure — or a rebase conflict — can never discard paid work
      # (issue #64). The cheatsheet lands in a second commit below.
      - name: Commit + push lesson to main
        env:
          R2_KEY: ${{ steps.input.outputs.r2_key }}
          STEM: ${{ steps.meta.outputs.stem }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -e
          git config user.name "lesson-journal-bot"
          git config user.email "bot@lesson-journal.pages.dev"

          # Ensure we're on main (we should be, since this trigger checks out
          # the default branch, but being explicit avoids surprises).
          git checkout main

          git add lessons/
          if git diff --staged --quiet; then
            echo "::error::Pipeline produced no lesson changes under lessons/ — refusing to continue."
            exit 1
          fi

          {
            echo "lesson: $STEM"
            echo
            echo "Generated from R2 key: $R2_KEY"
            echo "Lesson date: $DATE"
            echo
            echo "Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>"
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt

          # The pipeline could in theory dirty other tracked files. The lesson
          # is already committed — drop everything else so rebase has a clean
          # working tree.
          git restore .

          # Rebase in case another run landed on main while we were processing,
          # then push. Never force-push main.
          git pull --rebase origin main
          git push origin main

      # Last-resort checkpoint: even if the push above somehow failed, the
      # generated lesson survives as an artifact for a few days. The repo is
      # private, so the artifact is too.
      - name: Upload generated lesson (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lesson-${{ steps.meta.outputs.stem }}
          path: |
            lessons/${{ steps.meta.outputs.date }}-*.json
            lessons/${{ steps.meta.outputs.date }}-*.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Update cheatsheet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/build-cheatsheet.ts

      - name: Commit + push cheatsheet to main
        env:
          STEM: ${{ steps.meta.outputs.stem }}
        run: |
          set -e
          git add cheatsheet.json
          if git diff --staged --quiet; then
            echo "Cheatsheet unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "cheatsheet: after lesson $STEM"
          git restore .
          git pull --rebase origin main
          git push origin main

      - name: Upload workdir logs (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-logs-${{ steps.meta.outputs.stem }}
          # Intentionally excludes work/run/transcript.txt — raw transcript
          # contains PII (names, schedule, off-topic chatter) that the
          # extraction step is supposed to scrub before lessons are published.
          path: |
            work/run/logs/
            work/run/frames-manifest.json
          if-no-files-found: ignore
          retention-days: 3
