name: Release

on:
  workflow_run:
    workflows: ['PR gate']
    branches: [main]
    types: [completed]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.9.0
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  # Ignored PR/failure events must not replace a queued publication.
  group: >-
    ${{ (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)) &&
        'hornbook-release' || format('release-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.automatic.outputs.ready || steps.manual.outputs.ready }}
      tag: ${{ steps.automatic.outputs.tag || steps.manual.outputs.tag }}
      revision: ${{ steps.automatic.outputs.revision || steps.manual.outputs.revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'workflow_run'
        with:
          node-version: 22
          cache: npm
      - name: Install release validation dependencies
        if: github.event_name == 'workflow_run'
        run: npm ci --no-audit --no-fund
      - name: Create tag for a new version on verified main
        if: github.event_name == 'workflow_run'
        id: automatic
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/auto-release.ts
      - name: Resolve an explicit release tag
        if: github.event_name != 'workflow_run'
        id: manual
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          revision=$(git rev-parse "refs/tags/${REQUESTED_TAG}^{commit}")
          {
            echo "ready=true"
            echo "tag=$REQUESTED_TAG"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate tag, package and release notes
        id: release
        run: |
          set -euo pipefail
          npm run release:check -- --tag "$RELEASE_TAG" --output release-notes.md
          {
            echo "version=${RELEASE_TAG#v}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Deterministic checks
        run: |
          npm run lint
          npm run typecheck:scripts
          npm run test:scripts
          npm test -- --watch=false
          npm run build
          npm audit --audit-level=high
      - name: Production API smoke
        run: npm run harness:api
      - name: Production browser walk
        run: xvfb-run -a npm run harness:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error

  desktop:
    name: Build ${{ matrix.name }} distribution
    needs: [prepare, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            harness: npm run harness:electron
            updates: release/latest.yml
          - name: macOS
            os: macos-latest
            harness: npm run harness:electron
            updates: release/latest-mac.yml
          - name: Linux
            os: ubuntu-latest
            harness: xvfb-run -a npm run harness:electron
            updates: release/latest-linux.yml
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Build installers
        shell: bash
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder --config electron-builder.config.cjs --publish never \
            --config.linux.maintainer="Danylo Nikulin <83497040+DanyloNikulin@users.noreply.github.com>"
      - name: Require updater metadata
        run: node -e "const fs=require('node:fs');const manifest=process.argv[1];const files=fs.readdirSync('release');if(!fs.existsSync(manifest))throw new Error('Missing updater manifest');const differential=process.platform==='linux'?files.some((name)=>name.endsWith('.AppImage'))&&/blockMapSize:\s*[1-9]\d*/.test(fs.readFileSync(manifest,'utf8')):files.some((name)=>name.endsWith('.blockmap'));if(!differential)throw new Error('Missing updater block maps for ${{ matrix.name }}')" "${{ matrix.updates }}"
      - name: Walk packaged application
        run: ${{ matrix.harness }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.blockmap
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.yml
            release/*.zip

  docker:
    needs: [prepare, verify]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ needs.verify.outputs.image }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' && !startsWith(env.RELEASE_TAG, 'v0.') }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ needs.verify.outputs.revision }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

  publish:
    needs: [prepare, verify, desktop, docker]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: release-metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: release-files
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"
          (cd release-files && sha256sum ./* > SHA256SUMS.txt)
          release_flags=()
          if [[ "$RELEASE_TAG" == v0.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
            gh release edit "$RELEASE_TAG" --title "Hornbook ${{ needs.verify.outputs.version }}" --notes-file release-metadata/release-notes.md "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" release-files/* --verify-tag \
              --title "Hornbook ${{ needs.verify.outputs.version }}" \
              --notes-file release-metadata/release-notes.md "${release_flags[@]}"
          fi
