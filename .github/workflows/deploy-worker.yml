name: Deploy dispatcher worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        run: npm ci --no-audit --no-fund
        working-directory: worker

      - name: Test worker
        run: npm test
        working-directory: worker

      - name: Type-check worker
        run: npm run typecheck
        working-directory: worker

      # Idempotent list-then-create. The previous "create + continue-on-error"
      # steps went green when the token lacked Queues/R2 permissions, leaving
      # the worker deployed but never triggered. Now a missing
      # resource is created and a failure to create it fails the job.
      - name: Ensure queues exist
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Match the name as a whole token so "hornbook-uploads"
          # does not match "hornbook-uploads-dlq".
          # Capture first, grep second: with pipefail, grep -q closing the pipe
          # early can make wrangler exit non-zero and mask a real match.
          queues=$(npx wrangler queues list)
          has_queue() { grep -qE "(^|[^a-z0-9-])$1([^a-z0-9-]|$)" <<<"$queues"; }
          for q in hornbook-uploads-dlq hornbook-uploads; do
            if has_queue "$q"; then
              echo "✓ queue $q exists"
            else
              echo "Creating queue $q"
              npx wrangler queues create "$q"
            fi
          done

      - name: Deploy worker + sync GITHUB_TOKEN secret
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: worker
          secrets: |
            GITHUB_TOKEN
          command: deploy
        env:
          GITHUB_TOKEN: ${{ secrets.WORKER_GH_TOKEN }}

      # REPLAY_TOKEN gates the /replay and /status operator endpoints
      #. Synced separately from the deploy above so a missing
      # GH secret cannot fail the deploy — without it the endpoints stay
      # disabled (the worker answers 404) and dedup keeps working.
      - name: Sync REPLAY_TOKEN secret (if configured)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPLAY_TOKEN: ${{ secrets.WORKER_REPLAY_TOKEN }}
        run: |
          if [ -z "$REPLAY_TOKEN" ]; then
            echo "GH secret WORKER_REPLAY_TOKEN is not set — /replay and /status stay disabled."
            exit 0
          fi
          echo "$REPLAY_TOKEN" | npx wrangler secret put REPLAY_TOKEN

      # The R2 → Queue subscription is the one binding that makes uploads
      # trigger anything. Create it if missing, then verify it is present —
      # and fail the job if it is not.
      - name: Ensure R2 bucket notification exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bucket=hornbook-audio
          queue=hornbook-uploads
          has_rule() {
            local rules
            rules=$(npx wrangler r2 bucket notification list "$bucket")
            grep -qE "(^|[^a-z0-9-])$queue([^a-z0-9-]|$)" <<<"$rules"
          }
          if has_rule; then
            echo "✓ $bucket → $queue notification exists"
          else
            echo "Creating $bucket → $queue notification"
            npx wrangler r2 bucket notification create "$bucket" --event-type object-create --queue "$queue"
          fi
          if ! has_rule; then
            echo "::error::R2 bucket '$bucket' has no object-create notification to queue '$queue' — uploads will never trigger the pipeline."
            exit 1
          fi
