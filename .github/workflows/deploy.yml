name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Nothing under these paths reaches the Pages bundle; the worker has its
    # own deploy workflow.
    paths-ignore:
      - 'worker/**'
      - 'docs/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}
  # GITHUB_TOKEN pushes (from process-lesson committing a new lesson, or
  # vocab-review committing schema.ts) do NOT re-trigger workflows by design —
  # chain explicitly so those changes go live without manual intervention
  # (the vocab-review leg).
  workflow_run:
    workflows: ['Process lesson', 'Vocab review']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip workflow_run firings where the upstream Process lesson failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build Angular (with lessons data prebuild)
        run: npm run build

      # After the build so the derived artifacts the schema spec reads
      # (_cards.json, _vocab.json, lessons-meta.json) already exist.
      - name: Test
        run: npm test -- --watch=false

      # scripts/ is outside the Angular test + tsconfig graph: ng test only
      # picks up src/**/*.spec.ts and no tsconfig included scripts/, so the
      # Record<TopicT, …> exhaustiveness check in topic-to-category.ts and the
      # five scripts/lib specs never ran in CI. Run them here.
      - name: Typecheck pipeline scripts
        run: npm run typecheck:scripts

      - name: Test pipeline scripts
        run: npm run test:scripts

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Idempotent: `pages project create` errors if the project already
        # exists, so check first via `project list` and only create when
        # missing. Avoids the perpetual red-X on this step.
        run: |
          set -e
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -qF "hornbook"; then
            echo "✓ Pages project already exists"
          else
            echo "Pages project missing — creating"
            npx --yes wrangler@4 pages project create hornbook --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist/hornbook/browser --project-name=hornbook --branch=main --commit-dirty=true
