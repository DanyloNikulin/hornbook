name: PR gate

# The final "gate" job is the single branch-protection check. It collects the
# ordinary quality checks and packaged desktop walks on all three platforms.
#
# Hornbook's data never goes through git or CI: the journal folder is written
# by the app itself. A successful main gate can release a newly bumped version.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Workflow lint first — cheap, and it validates the gate itself.
      # Pinned version + sha256 instead of an unpinned `go install` / curl|bash.
      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      # journal/*/_derived/ is gitignored and generated — the schema spec reads
      # it, so it must exist before any Angular step. Same commands the
      # prebuild hook runs (idempotent, no AI calls).
      - name: Generate content (backfill topics + derived data)
        run: npm run backfill-topics -- --auto && npm run build-data

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Build (production)
        run: npm run build

      # Tracked generated artifacts of the demo journal must be fresh: lesson
      # `topics` fields and journal/*/_topics-version.json. (Derived files are
      # gitignored; the cheat sheet needs ANTHROPIC_API_KEY and stays out.)
      # If a PR adds a demo lesson without topics or changes
      # scripts/lib/topics.ts, the prebuild hook rewrites tracked files — fail
      # with the diff so the author commits the regeneration.
      - name: Fail if tracked generated artifacts are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Content generation changed tracked files — run 'npm run backfill-topics -- --auto && npm run build-data' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      # scripts/ and server/ are outside the Angular test + tsconfig graph —
      # keep their specs and the Record<TopicT, …> exhaustiveness check inside
      # the gate.
      - name: Typecheck pipeline scripts and server
        run: npm run typecheck:scripts

      - name: Test pipeline scripts and server
        run: npm run test:scripts

      - name: API smoke
        run: npm run harness:api

      - name: Browser walk against the production build
        run: xvfb-run -a npm run harness:ui

      # High/critical only — a moderate-severity advisory with no fix released
      # yet must not freeze every PR.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  desktop:
    name: Packaged desktop (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            harness: xvfb-run -a npm run harness:electron
          - os: windows-latest
            harness: npm run harness:electron
          - os: macos-latest
            harness: npm run harness:electron
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build app and compiled server
        run: npm run build
      - name: Package current platform
        run: npx electron-builder --dir --config electron-builder.config.cjs
      - name: Walk packaged app
        run: ${{ matrix.harness }}

  container:
    name: Packaged Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" -t hornbook:ci .
      - name: Start image and exercise its API
        run: |
          set -euo pipefail
          docker run --detach --name hornbook-ci --publish 127.0.0.1:8787:8787 \
            --env HORNBOOK_PASSWORD=ci-password hornbook:ci
          trap 'docker logs hornbook-ci' ERR
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --user hornbook:ci-password http://127.0.0.1:8787/api/mode > mode.json; then
              break
            fi
            sleep 1
          done
          expected=$(node -p "require('./package.json').version")
          node -e "const fs=require('node:fs');const mode=JSON.parse(fs.readFileSync('mode.json'));if(mode.mode!=='hosted'||mode.version!==process.argv[1])process.exit(1)" "$expected"
          curl --fail --silent --user hornbook:ci-password \
            --header 'Content-Type: application/json' \
            --data '{"target":"ja","learner":"en","title":"Container smoke"}' \
            http://127.0.0.1:8787/api/sections > write.json
          node -e "const fs=require('node:fs');const section=JSON.parse(fs.readFileSync('write.json'));if(section.id!=='ja-en')process.exit(1)"
          docker rm --force hornbook-ci

  gate:
    name: gate
    if: always()
    needs: [checks, desktop, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate component
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$DESKTOP_RESULT" = success
          test "$CONTAINER_RESULT" = success
