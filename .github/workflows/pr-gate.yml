name: PR gate

# The single required quality gate for pull requests into main.
# Everything runs in ONE job so branch protection only needs to require the
# "gate" check context. Covers: reproducible installs, app lint/test/build,
# pipeline-script typecheck + tests, worker tests + typecheck, freshness of
# tracked generated artifacts, dependency audit, and workflow syntax lint.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Workflow lint first — cheap, and it validates the gate itself.
      # Pinned version + sha256 instead of an unpinned `go install` / curl|bash.
      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      # src/app/_data/lessons-meta.json is gitignored and generated — `ng test`
      # imports it, so content must exist before any Angular step. Same
      # commands the prebuild hook runs (idempotent, no AI calls).
      - name: Generate content (backfill topics + derived data)
        run: npm run backfill-topics -- --auto && npm run build-data

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Build (production)
        run: npm run build

      # Tracked generated artifacts must be fresh: lesson `topics` fields,
      # lessons/_topics-version.json, lessons/_topics-suggestions.json.
      # (The bulky derived files — src/app/_data/, lessons/_cards/_vocab/
      # _search-index.json — are gitignored, so they can never be stale in git;
      # cheatsheet.json needs ANTHROPIC_API_KEY and stays out of the gate.)
      # If a PR adds a lesson without topics or changes scripts/lib/topics.ts,
      # the prebuild hook rewrites tracked files — fail with the diff so the
      # author commits the regeneration.
      - name: Fail if tracked generated artifacts are stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Content generation changed tracked files — run 'npm run backfill-topics -- --auto && npm run build-data' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      # scripts/ is outside the Angular test + tsconfig graph —
      # keep the scripts/lib specs and the Record<TopicT, …> exhaustiveness
      # check inside the gate.
      - name: Typecheck pipeline scripts
        run: npm run typecheck:scripts

      - name: Test pipeline scripts
        run: npm run test:scripts

      - name: Install worker dependencies (npm ci)
        run: npm ci --no-audit --no-fund
        working-directory: worker

      - name: Test worker
        run: npm test
        working-directory: worker

      - name: Type-check worker
        run: npm run typecheck
        working-directory: worker

      # High/critical only — a moderate-severity advisory with no fix released
      # yet must not freeze every PR.
      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit worker dependencies
        run: npm audit --audit-level=high
        working-directory: worker
