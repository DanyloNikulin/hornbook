name: Bug report
description: Report a reproducible Hornbook defect.
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve Hornbook. Never attach a real journal,
        transcript, recording, API key or `secrets.json`.
  - type: input
    id: version
    attributes:
      label: Hornbook version
      placeholder: 0.9.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Windows installer or portable app
        - macOS app
        - Linux AppImage or deb
        - Docker
        - Source checkout
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a throwaway or fictional lesson when possible.
      placeholder: |
        1. Open…
        2. Choose…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitised diagnostics
      description: Include relevant `hornbook doctor` output or logs after removing private data and paths.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed lesson content, recordings, keys and personal paths.
          required: true
